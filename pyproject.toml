[project]
name = "suse-ops-server"
version = "0.1.0"
description = "MCP server bridging AI assistants with the SUSE Linux ecosystem"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "GPL-3.0-only OR MIT" }
authors = [{ name = "Tappy", email = "chrisjohntapp@gmail.com" }]
keywords = [
  "suse",
  "opensuse",
  "sles",
  "mcp",
  "model-context-protocol",
  "zypper",
  "obs",
  "ai-assistant",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Site Reliability Engineers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Packaging",
  "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "markdownify>=0.12.0",
]

[project.scripts]
suse-ops-server = "suse_ops_server:main_sync"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-v",
  "--strict-markers",
  "--cov=suse_ops_server",
  "--cov-report=term-missing",
  "--cov-report=html",
]

[tool.coverage.run]
source = ["suse_ops_server"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[build-system]
requires = ["uv_build>=0.9.4"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]
